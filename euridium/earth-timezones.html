<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sphère 3D de la Terre avec fuseaux horaires</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at top, #0a1a2a, #000814);
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #eef7ff;
      }

      #scene {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .legend {
        position: absolute;
        top: 24px;
        left: 24px;
        padding: 12px 16px;
        background: rgba(2, 18, 38, 0.7);
        border: 1px solid rgba(98, 181, 255, 0.3);
        border-radius: 12px;
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        max-width: 280px;
      }

      .legend h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }

      .legend p {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div class="legend">
      <h1>Terre 3D + fuseaux horaires</h1>
      <p>
        Faites glisser pour faire tourner la Terre. La grille des fuseaux horaires
        représente les 24 bandes longitudinales (UTC-12 → UTC+12).
      </p>
    </div>

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
      import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

      const container = document.getElementById("scene");
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 0, 4.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.minDistance = 2.5;
      controls.maxDistance = 7;

      const ambient = new THREE.AmbientLight(0x9ecfff, 0.35);
      scene.add(ambient);

      const sun = new THREE.DirectionalLight(0xffffff, 1.1);
      sun.position.set(5, 2, 2);
      scene.add(sun);

      const textureLoader = new THREE.TextureLoader();
      const earthTexture = textureLoader.load(
        "https://raw.githubusercontent.com/threejs/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg"
      );

      const earthGeometry = new THREE.SphereGeometry(1.5, 64, 64);
      const earthMaterial = new THREE.MeshStandardMaterial({
        map: earthTexture,
        roughness: 1,
        metalness: 0,
      });

      const earth = new THREE.Mesh(earthGeometry, earthMaterial);
      scene.add(earth);

      const atmosphereGeometry = new THREE.SphereGeometry(1.55, 64, 64);
      const atmosphereMaterial = new THREE.MeshStandardMaterial({
        color: 0x47b5ff,
        transparent: true,
        opacity: 0.15,
        roughness: 0.1,
        metalness: 0.1,
      });
      const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
      scene.add(atmosphere);

      const timezoneGroup = new THREE.Group();
      const timezoneColors = [
        "#0b4f6c",
        "#145277",
        "#1c5e87",
        "#246a97",
        "#2d76a7",
        "#3683b7",
        "#3f91c7",
        "#4aa0d7",
      ];

      const timezoneMaterial = new THREE.MeshBasicMaterial({
        transparent: true,
        opacity: 0.22,
        side: THREE.DoubleSide,
      });

      const timezoneRadius = 1.52;
      const timezoneHeight = 3.04;
      const timezoneWidth = (2 * Math.PI * timezoneRadius) / 24;

      for (let i = 0; i < 24; i += 1) {
        const color = timezoneColors[i % timezoneColors.length];
        const bandGeometry = new THREE.PlaneGeometry(
          timezoneWidth,
          timezoneHeight
        );
        const bandMaterial = timezoneMaterial.clone();
        bandMaterial.color = new THREE.Color(color);

        const band = new THREE.Mesh(bandGeometry, bandMaterial);
        const angle = (i / 24) * Math.PI * 2;

        band.position.set(
          Math.sin(angle) * timezoneRadius,
          0,
          Math.cos(angle) * timezoneRadius
        );
        band.lookAt(0, 0, 0);
        band.rotateY(Math.PI / 2);

        timezoneGroup.add(band);
      }

      scene.add(timezoneGroup);

      const starGeometry = new THREE.BufferGeometry();
      const starCount = 2000;
      const starVertices = [];
      for (let i = 0; i < starCount; i += 1) {
        const radius = 30 + Math.random() * 40;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta);
        const z = radius * Math.cos(phi);
        starVertices.push(x, y, z);
      }

      starGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(starVertices, 3)
      );

      const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.1,
        transparent: true,
        opacity: 0.7,
      });

      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);

      const clock = new THREE.Clock();
      const animate = () => {
        const elapsed = clock.getElapsedTime();
        earth.rotation.y = elapsed * 0.05;
        atmosphere.rotation.y = elapsed * 0.055;
        timezoneGroup.rotation.y = elapsed * 0.05;

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
